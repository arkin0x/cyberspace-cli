[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "cyberspace-cli"
version = "0.0.1"
description = "CLI client for navigating Cyberspace (v2)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arkinox" }]
dependencies = [
  "typer>=0.12",
  "coincurve>=20.0.0",
  "cryptography>=42.0.0",
  # HOSAKA cloud-compute fallback (cloud_compute.py + nostr_signer.py + nostr_relay.py).
  # All three are needed at import time even when the user never offloads.
  "httpx>=0.27.0",
  "secp256k1>=0.14.0",
  "nest-asyncio>=1.6.0",
  "websocket-client>=1.7.0",
  "hosaka-client>=0.1.0",
]

[project.optional-dependencies]
# Optional GUI visualizer for `cyberspace 3d`.
# Note: `tkinter` is a system package on many Linux distros (e.g. python3-tk).
visualizer = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]
# Optional TUI visualizer for `cyberspace move viz`.
viz = [
  "textual>=0.50.0",
]

[project.scripts]
cyberspace = "cyberspace_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberspace_cli", "src/cyberspace_core"]
